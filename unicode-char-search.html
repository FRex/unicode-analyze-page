<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="data.js"></script>
    <script type="text/javascript" src="blocks.js"></script>
    <title>Unicode</title>
    <style>
        #mainblock {
            margin-left: auto;
            margin-right: auto;
            padding-top: 2em;
            padding-left: 2%;
            padding-right: 2%;
            text-align: center;
        }

        input#text {
            max-width: 70%;
        }

        #mainblock>table {
            margin: auto;
        }

        #text {
            width: 100%;
            text-align: center;
        }

        ul {
            padding-bottom: 2em;
        }

        #results>div {
            border: 1px solid black;
            display: inline-block;
            min-width: 10em;
            min-height: 10em;
            margin: 1px;
        }
    </style>
</head>

<script>
    function findBlock(codepoint) {
        for (const block of blocks)
            if (block[0] <= codepoint && codepoint <= block[1])
                return block[2];

        return "No_Block";
    }

    function createTileDiv(pair) {
        var div = document.createElement('div');

        var div2 = document.createElement('div');
        div2.innerText = 'U+' + pair[0].toString(16).toUpperCase();
        div.appendChild(div2);

        var div2 = document.createElement('div');
        div2.innerText = String.fromCodePoint(pair[0]);
        div2.style.fontSize = '4rem'
        div.appendChild(div2);

        var div2 = document.createElement('div');
        div2.innerText = pair[1];
        div.appendChild(div2);

        var div2 = document.createElement('div');
        div2.innerText = 'Block: ' + findBlock(pair[0]);
        div.appendChild(div2);

        var button = document.createElement('input')
        button.type = 'button';
        button.value = 'copy';
        div.appendChild(button);

        return div;
    }

    function refreshResults(firstload) {
        document.getElementById('unicode-version').innerText = unicode_version;

        if (firstload) {
            var url = new URL(window.location.href);
            var textparam = url.searchParams.get("text");
            if (textparam !== null)
                document.getElementById("text").value = textparam;
        }

        var text = document.getElementById("text").value;
        var link = window.location.href.split('?')[0] + '?text=' + encodeURIComponent(text);
        if (text.length === 0)
            link = window.location.href.split('?')[0];

        var results = document.getElementById('results');
        while (results.firstChild)
            results.removeChild(results.firstChild);


        var terms = text.toUpperCase().split(/(\s+)/u);
        var resoultcount = 0;
        for (const pair of data) {
            // if (pair[0] < 40) continue;

            var skip = false;
            for (const term of terms) {
                if (!pair[1].includes(term)) {
                    skip = true;
                    break;
                }
            }

            if (skip)
                continue;
            results.appendChild(createTileDiv(pair));
            ++resoultcount;
            if (pair[0] > 6000) break;
        }

        document.getElementById('result-count').innerText = resoultcount + ' results';

        if (!firstload)
            history.replaceState(null, '', link);
    }


</script>

<body onload="refreshResults(true);">
    <div style="position:relative;">
        <a href="https://github.com/FRex/unicode-analyze-page"
            style="position: absolute;right:0;top:0">GitHub/FRex/unicode-analyze-page</a>
    </div>

    <div id='mainblock'>
        <input type="text" oninput="refreshResults(false);" id="text" autofocus>
        <div id="unicode-version"></div>
        <div id="result-count"></div>

        <div id="results"></div>
    </div>
</body>

</html>
